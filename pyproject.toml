[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oura-personal-cli"
version = "0.1.0"
description = "Portable owner-scoped Oura CLI with OAuth, SQLite sync and signed webhooks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
oura = "oura_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oura_cli = ["skill/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[project.urls]
Source = "https://github.com/gletushov/oura-personal-cli"
Issues = "https://github.com/gletushov/oura-personal-cli/issues"
